<h2 class="collection-title">Mi colección</h2>

@if (loading()) {
  <p>Cargando...</p>
} @else if (error()) {
  <p>{{ error() }}</p>
} @else if (shelves().length === 0) {
  <p>No hay juegos todavía.</p>
} @else {
  @for (shelf of shelves(); track shelf.platform) {
    <section class="shelf">
      <h3 class="shelf-header">{{ shelf.platform }}</h3>
      <div class="shelf-row">
        @for (item of shelf.items; track item.editionId) {
          <app-game-spine
            [title]="item.title"
            [platform]="item.platform"
            (click)="onSpineClick(item)"
          />
        }
      </div>
    </section>
  }
}
